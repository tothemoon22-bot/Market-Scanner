[project]
name = "market-scanner"
version = "0.1.0"
description = "Kalshi no-arbitrage scanner — a research instrument for measuring whether fee-adjusted, executable pricing inconsistencies exist"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    # Not imported by any first-party module. It is still load-bearing: uvicorn
    # requires only click and h11, and `uvicorn/protocols/websockets/auto.py`
    # sets AutoWebSocketsProtocol to None when neither websockets nor wsproto is
    # installed -- at which point the server rejects the upgrade to /ws and the
    # dashboard's live push stops, silently. Do not delete this as unused; the
    # clean-environment test asserts the protocol resolves.
    "websockets>=12.0",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "structlog>=24.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "pypdf>=4.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# All four shipped trees, not just `src`. Until this listed them, `pip install
# -e .` packaged only `src`, and `dashboard`, `scanner` and `monitor` imported
# solely because the working directory happened to be on `sys.path` -- an
# undeclared coincidence one `WorkingDirectory` change away from removing three
# packages. `tests` and `tools` are deliberately absent: neither ships.
include = ["src*", "dashboard*", "scanner*", "monitor*"]

[tool.setuptools.package-data]
# The PWA is served off disk relative to `dashboard/__file__`, so a package
# without these is importable and broken.
dashboard = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: builds a virtualenv and installs the package; needs a package index",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
